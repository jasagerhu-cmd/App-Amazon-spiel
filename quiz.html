<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keine Ahnung!</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;500;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<style>
/* Layout: eine Showbühne (max 720px). Oben der Kommentator mit Sprechblase, darunter Punktetafel und die Frage als Bühnenkarte. Bewusst nur ein Look: abgedunkeltes Fernsehstudio. */
:root {
  color-scheme: dark;
  --bg: #23103a;
  --stage: #33195a;
  --stage-2: #40216e;
  --ink: #fff4e0;
  --muted: #cdb9e6;
  --line: #5b3a8a;
  --gold: #ffc93c;
  --gold-ink: #2b1a00;
  --hot: #ff6a55;
  --hot-ink: #2e0700;
  --ok: #3ddc97;
  --ok-ink: #06281a;
  --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(ellipse 90% 60% at 50% -10%, #5a2c96 0%, rgba(90,44,150,0) 70%);
  background-repeat: no-repeat;
  color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  min-height: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Kopf */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.logo { font-family: var(--font-display); font-size: clamp(1.5rem, 6vw, 2.3rem); line-height: 1; margin: 0; letter-spacing: .01em; color: var(--gold); text-shadow: 3px 3px 0 var(--hot); transform: rotate(-2deg); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.tool { background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.tool[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

/* Kommentator */
.host { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: start; }
.host svg { width: 72px; height: 72px; display: block; }
.host .mouth { transform-origin: 36px 47px; }
.host.talking .mouth { animation: talk .28s infinite alternate; }
@keyframes talk { from { transform: scaleY(.35); } to { transform: scaleY(1.25); } }
.bubble { position: relative; background: var(--ink); color: #2a1440; border-radius: 6px 20px 20px 20px; padding: 12px 16px; font-weight: 500; min-width: 0; }
.bubble b { display: block; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: #7b4bb5; margin-bottom: 2px; }
.bubble.pop { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.96); opacity: .5; } to { transform: none; opacity: 1; } }

/* Punktetafel */
.scores { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { flex: 1 1 130px; min-width: 0; background: var(--stage); border: 2px solid var(--line); border-radius: 12px; padding: 8px 12px; display: grid; gap: 0; }
.chip .n { font-size: .78rem; font-weight: 600; color: var(--muted); overflow-wrap: anywhere; }
.chip .s { font-family: var(--font-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; line-height: 1.2; }
.chip.neg .s { color: var(--hot); }
.chip.on { border-color: var(--gold); background: var(--stage-2); }
.chip.out { opacity: .45; }

/* Bühne */
.card { background: var(--stage); border: 2px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 18px; min-width: 0; }
.eyebrow { font-size: .74rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.eyebrow span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(1.25rem, 4.6vw, 1.7rem); line-height: 1.2; margin: 0; text-wrap: balance; }
.question { font-size: clamp(1.15rem, 4.2vw, 1.45rem); font-weight: 600; line-height: 1.3; text-wrap: pretty; }
.hint { color: var(--muted); font-size: .92rem; }
.timer { height: 10px; background: #1a0b2c; border-radius: 99px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--gold); border-radius: 99px; transition: width .1s linear; }
.timer.low i { background: var(--hot); }

.answers { display: grid; gap: 10px; }
.answers.two { grid-template-columns: 1fr 1fr; }
.ans { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--stage-2); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-weight: 600; min-width: 0; }
.ans .k { font-family: var(--font-display); width: 38px; height: 38px; border-radius: 10px; background: var(--gold); color: var(--gold-ink); display: grid; place-items: center; }
.ans:not(:disabled):hover { border-color: var(--gold); transform: translateY(-1px); }
.ans:disabled { cursor: default; }
.ans.wait { opacity: .75; }
.ans.struck { opacity: .35; text-decoration: line-through; }
.ans.right { background: var(--ok); color: var(--ok-ink); border-color: var(--ok); }
.ans.right .k { background: var(--ok-ink); color: var(--ok); }
.ans.wrong { background: var(--hot); color: var(--hot-ink); border-color: var(--hot); }

.buzzers { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.buzz { background: var(--hot); color: var(--hot-ink); border: 0; border-bottom: 5px solid #b83422; border-radius: 16px; padding: 14px 10px; font-weight: 800; display: grid; gap: 2px; justify-items: center; min-width: 0; }
.buzz small { font-weight: 600; font-size: .75rem; opacity: .8; }
.buzz span { overflow-wrap: anywhere; }
.buzz:active { transform: translateY(3px); border-bottom-width: 2px; }
.buzz:disabled { background: var(--line); color: var(--muted); border-bottom-color: #3d2563; cursor: default; }

.btn { background: var(--gold); color: var(--gold-ink); border: 0; border-bottom: 4px solid #c98f00; border-radius: 14px; padding: 13px 22px; font-weight: 800; font-size: 1.05rem; justify-self: start; }
.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.fact { background: #1a0b2c; border-radius: 12px; padding: 14px 16px; }
.fact b { color: var(--gold); }

/* Setup */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 10px; }
.mode { text-align: left; background: var(--stage-2); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.mode strong { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; }
.mode span { color: var(--muted); font-size: .9rem; }
.mode[aria-checked="true"] { border-color: var(--gold); background: #4b2880; }
.mode[aria-checked="true"] strong { color: var(--gold); }
.label { font-size: .74rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.count { display: flex; gap: 8px; }
.count button { width: 48px; height: 48px; border-radius: 12px; background: var(--stage-2); border: 2px solid var(--line); font-family: var(--font-display); font-size: 1.1rem; }
.count button[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
input[type="text"] { font: inherit; color: var(--ink); background: #1a0b2c; border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px; width: 100%; min-width: 0; }
input.big { font-family: var(--font-display); font-size: 1.5rem; text-align: center; }
.group { display: grid; gap: 8px; }

/* Schätzen und Rangliste */
.list { display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: baseline; background: var(--stage-2); border-radius: 12px; padding: 10px 14px; font-variant-numeric: tabular-nums; }
.line .who { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.line .d { color: var(--muted); font-size: .88rem; }
.line.win { outline: 2px solid var(--ok); }
.line .v { font-family: var(--font-display); }
.bignum { font-family: var(--font-display); font-size: clamp(2rem, 10vw, 3.2rem); color: var(--gold); line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.lives { letter-spacing: .1em; }

@media (max-width: 440px) {
  .host { grid-template-columns: 54px 1fr; gap: 10px; }
  .host svg { width: 54px; height: 54px; }
  .card { padding: 16px; }
  .answers.two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .host.talking .mouth, .bubble.pop { animation: none; }
  .timer i { transition: none; }
}

/* ---------- 3D-Ausbau: Tiefe über Licht, Kanten und Schatten; alles skaliert mit der Breite ---------- */
[hidden] { display: none !important; }
body {
  font-size: clamp(17px, 14px + .45vw, 20px);
  background-image:
    radial-gradient(ellipse 90% 60% at 50% -10%, #6a35b0 0%, rgba(90,44,150,0) 70%),
    linear-gradient(115deg, rgba(255,201,60,0) 30%, rgba(255,201,60,.07) 38%, rgba(255,201,60,0) 46%),
    linear-gradient(245deg, rgba(255,106,85,0) 30%, rgba(255,106,85,.07) 38%, rgba(255,106,85,0) 46%);
}
.wrap { max-width: 880px; gap: 22px; }
.logo { font-size: clamp(1.8rem, 7vw, 3.2rem); padding-bottom: 8px;
  text-shadow: 1px 1px 0 #e0a800, 2px 2px 0 #d99b00, 3px 3px 0 var(--hot), 4px 4px 0 var(--hot), 5px 5px 0 #c9402e, 6px 6px 0 #c9402e, 10px 14px 18px rgba(0,0,0,.45); }
.host { grid-template-columns: auto 1fr; align-items: center; gap: 20px; }
.kalle { position: relative; width: clamp(116px, 26vw, 220px); aspect-ratio: 1; filter: drop-shadow(0 16px 12px rgba(0,0,0,.45)); }
.kalle canvas, .host .kalle svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.bubble { border-radius: 22px; padding: 16px 20px; font-size: 1.05rem; box-shadow: 0 6px 0 #cbb89a, 0 20px 30px rgba(0,0,0,.4); }
.bubble::before { content: ""; position: absolute; left: -11px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-left: 0; border-right-color: var(--ink); }
#stage { perspective: 1400px; }
.card { background: linear-gradient(180deg, #3f216f 0%, var(--stage) 60%); border: 0; border-radius: 24px; padding: clamp(18px, 3vw, 32px); margin-bottom: 8px; transform-origin: 50% 0;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.14), 0 8px 0 #1c0b33, 0 30px 50px rgba(0,0,0,.45); }
.card.enter { animation: flip .5s cubic-bezier(.2,.9,.3,1.15); }
@keyframes flip { from { transform: rotateX(-28deg) translateY(30px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.ans { background: linear-gradient(180deg, #5932a6, #45247c); border: 0; border-radius: 16px; padding: 14px 16px; margin-bottom: 6px; transition: transform .12s, box-shadow .12s;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.16), 0 6px 0 #25103f, 0 12px 18px rgba(0,0,0,.3); }
.ans:not(:disabled):hover { transform: translateY(-3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 9px 0 #25103f, 0 18px 24px rgba(0,0,0,.35); }
.ans:not(:disabled):active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.1), 0 2px 0 #25103f; }
.ans .k { box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.ans.right { background: linear-gradient(180deg, #62f2b4, var(--ok)); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 6px 0 #1c8f5e, 0 0 34px rgba(61,220,151,.45); }
.ans.wrong { background: linear-gradient(180deg, #ff8a78, var(--hot)); box-shadow: inset 0 2px 0 rgba(255,255,255,.3), 0 6px 0 #b83422; }
.chip { border: 0; margin-bottom: 5px; box-shadow: inset 0 2px 0 rgba(255,255,255,.12), 0 5px 0 #1c0b33; }
.chip.on { box-shadow: inset 0 0 0 2px var(--gold), 0 5px 0 #1c0b33, 0 0 24px rgba(255,201,60,.35); }
.mode { border: 0; margin-bottom: 5px; transition: transform .12s; box-shadow: inset 0 2px 0 rgba(255,255,255,.14), 0 5px 0 #25103f; }
.mode:hover { transform: translateY(-2px); }
.mode[aria-checked="true"] { box-shadow: inset 0 0 0 3px var(--gold), 0 5px 0 #25103f, 0 0 26px rgba(255,201,60,.3); }
.btn { border-bottom-width: 6px; padding: 15px 26px; box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 14px 20px rgba(0,0,0,.3); }
.btn.ghost { box-shadow: none; border-bottom-width: 2px; padding: 11px 18px; font-size: .95rem; }
.buzz { border-bottom-width: 7px; box-shadow: inset 0 3px 0 rgba(255,255,255,.35), 0 12px 18px rgba(0,0,0,.3); }
.timer { height: 14px; box-shadow: inset 0 3px 5px rgba(0,0,0,.6); }
.timer i { background: linear-gradient(180deg, #ffe28a, var(--gold)); }
.timer.low i { background: linear-gradient(180deg, #ff9c8c, var(--hot)); }
.line, .fact { box-shadow: inset 0 2px 0 rgba(255,255,255,.08); }
select { font: inherit; color: var(--ink); background: #1a0b2c; border: 2px solid var(--line); border-radius: 12px; padding: 11px 14px; flex: 1 1 200px; min-width: 0; max-width: 100%; }
@media (max-width: 440px) { .host { grid-template-columns: auto 1fr; gap: 12px; } .host .kalle svg { width: 100%; height: 100%; } .bubble { padding: 12px 14px; font-size: 1rem; } }
@media (prefers-reduced-motion: reduce) { .card.enter { animation: none; } .ans, .mode { transition: none; } }

/* ---------- Studio: die 3D-Bühne füllt die ganze Breite, Kopfzeile und Sprechblase liegen darüber ---------- */
body { overflow-x: clip; padding-top: 0; background-image: none; }
.studio { position: relative; display: flex; flex-direction: column; gap: 12px; padding-top: 18px; min-height: clamp(360px, 56vh, 600px); transition: min-height .5s; }
body.ingame .studio { min-height: clamp(290px, 42vh, 460px); }
.studio canvas { position: absolute; top: 0; left: 50%; width: 100vw; height: calc(100% + 80px); transform: translateX(-50%); z-index: 0; display: block;
  -webkit-mask-image: linear-gradient(#000 76%, transparent); mask-image: linear-gradient(#000 76%, transparent); }
.studio > :not(canvas) { position: relative; z-index: 1; }
.studio.flat { background: radial-gradient(ellipse 80% 70% at 50% 30%, #6a35b0 0%, rgba(90,44,150,0) 70%); }
.kalle2d { flex: 1; display: grid; place-items: center; }
.kalle2d svg { width: 130px; height: 130px; display: block; }
#host.talking .mouth { animation: talk .28s infinite alternate; transform-origin: 36px 47px; }
.studio .bubble { margin-top: auto; align-self: center; width: 100%; max-width: 660px; }
.studio .bubble::before { left: 50%; top: -11px; margin: 0 0 0 -10px; border: 10px solid transparent; border-top: 0; border-bottom-color: var(--ink); }
.studio .tool { background: rgba(26,11,44,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
@media (prefers-reduced-motion: reduce) { .studio { transition: none; } #host.talking .mouth { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="studio" id="host">
    <canvas id="k3d" aria-hidden="true"></canvas>
  <header class="top">
    <h1 class="logo">Keine Ahnung!</h1>
    <div class="tools">
      <button class="tool" id="tVoice" data-act="voice" aria-pressed="true">Stimme an</button>
      <button class="tool" id="tSound" data-act="sound" aria-pressed="true">Ton an</button>
      <button class="tool" id="tQuit" data-act="quit" hidden>Abbrechen</button>
    </div>
  </header>
    <div class="kalle2d" id="k2dbox"><svg id="k2d" viewBox="0 0 72 72" aria-hidden="true">
      <rect x="31" y="54" width="10" height="14" rx="3" fill="#8d6bc0"/>
      <rect x="20" y="66" width="32" height="5" rx="2.5" fill="#8d6bc0"/>
      <circle cx="36" cy="32" r="27" fill="#ffc93c"/>
      <path d="M11 24h50M9 33h54M12 42h48" stroke="#c98f00" stroke-width="2" fill="none"/>
      <path d="M19 19l11 4M53 19l-11 4" stroke="#2b1a00" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <circle cx="26" cy="29" r="4" fill="#2b1a00"/>
      <circle cx="46" cy="29" r="4" fill="#2b1a00"/>
      <ellipse class="mouth" cx="36" cy="47" rx="9" ry="4" fill="#2b1a00"/>
    </svg></div>
    <div class="bubble" id="bubble" aria-live="polite"><b>Kalle aus dem Off</b><span id="say"></span></div>
  </section>

  <section class="scores" id="scores" hidden></section>
  <main id="stage"></main>
</div>

<script>
/* ===================== FRAGEN =====================
   mc: a[0] ist immer die richtige Antwort, gemischt wird beim Spielen.
   tf: t = true (wahr) oder false (Quatsch).
   est: v = richtiger Wert, tol = Toleranz für "nah dran" im Solo-Spiel. */
const MC = [
{cat:"Liebe geht durch den Rücken", q:"Bei der Weltmeisterschaft im Frauentragen in Finnland schleppt man seine Partnerin über einen Hindernisparcours. Was gewinnt der Sieger?", a:["Das Gewicht der Getragenen in Bier","Eine lebenslange Rückenschule","Ein Rentier namens Pekka","Die Scheidungskosten"], f:"Bier nach Körpergewicht. Der einzige Wettbewerb der Welt, bei dem man hofft, dass die Partnerin vorher noch ein Dessert nimmt."},
{cat:"Finnland hat zu viel Freizeit", q:"Welche dieser Weltmeisterschaften findet NICHT in Finnland statt?", a:["Käserollen am Steilhang","Luftgitarre","Handyweitwurf","Frauentragen"], f:"Dem Käse rennt man in England hinterher, am Cooper's Hill in Gloucestershire. Der Rest ist finnisch. Die Winter dort sind lang."},
{cat:"Einsamkeit ist strafbar", q:"Was ist in der Schweiz laut Tierschutzverordnung verboten?", a:["Ein Meerschweinchen allein zu halten","Kühe ohne Glocke auszuführen","Katzen nach 22 Uhr rauszulassen","Goldfische im Kreis schwimmen zu lassen"], f:"Meerschweinchen sind soziale Tiere und brauchen Gesellschaft. Die Schweiz regelt Einsamkeit gesetzlich. Für Menschen steht das noch aus."},
{cat:"Gemüse als Waffe", q:"Was bewerfen sich Tausende Menschen jedes Jahr im spanischen Buñol?", a:["Tomaten","Paella-Reste","Orangen","Schinkenwürfel"], f:"La Tomatina: eine Stunde lang fliegen tonnenweise Tomaten. Danach riecht die Stadt wie eine Pizzeria nach dem Erdbeben."},
{cat:"All you can eat, alle können klettern", q:"Im thailändischen Lopburi wird jedes Jahr ein riesiges Buffet aufgebaut. Für wen?", a:["Für die Affen der Stadt","Für die Mönche des Nachbarlandes","Für Touristen, die sich verlaufen haben","Für die Geister ehemaliger Köche"], f:"Tonnenweise Obst und Süßes für ein paar Tausend Makaken. Die bedanken sich, indem sie den Touristen die Sonnenbrillen klauen."},
{cat:"Militärische Glanzleistungen", q:"Gegen wen zog die australische Armee 1932 mit Maschinengewehren ins Feld und gab nach wenigen Wochen entnervt auf?", a:["Emus","Kängurus","Kaninchen","Neuseeland"], f:"Der Große Emu-Krieg. Die Vögel rannten einfach weiter. Australien verlor gegen etwas, das aussieht wie ein Staubwedel auf Stelzen."},
{cat:"Fragen Sie Ihren Arzt oder Pommesbudenbesitzer", q:"Als was wurde Tomatenketchup in den 1830er-Jahren in den USA verkauft?", a:["Als Medizin","Als Schuhcreme","Als Rasierwasser","Als Babynahrung"], f:"Ein Arzt pries Tomatenextrakt gegen Verdauungsbeschwerden an, sogar in Pillenform. Pommes rot-weiß sind also streng genommen eine Kur."},
{cat:"Letzte Ruhe, wiederverschließbar", q:"Fredric Baur erfand die Pringles-Dose. Was geschah nach seinem Tod 2008?", a:["Ein Teil seiner Asche wurde in einer Pringles-Dose beigesetzt","Sein Sarg wurde mit Chips aufgefüllt","Die Firma benannte eine Sorte nach seinem Hund","Sein Grabstein bekam einen Plastikdeckel"], f:"Sein eigener Wunsch. Die Familie hielt auf dem Weg zum Bestatter noch am Supermarkt an und nahm die Sorte Original."},
{cat:"Anatomie für Angeber", q:"Was hat ein Oktopus, was du nicht hast?", a:["Drei Herzen und blaues Blut","Zwei Mägen und grünes Blut","Vier Lungen und keine Leber","Ein Herz in jedem Arm"], f:"Drei Herzen, blaues Blut und Arme, die halb selbstständig denken. Und trotzdem lebt er meist nur ein paar Jahre. Karma."},

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => n.toLocaleString("de-DE");
const store = {
  get(k, d) { try { const v = localStorage.getItem("ka_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ka_" + k, JSON.stringify(v)); } catch {} }
};
/* Zieht n Fragen, die auf diesem Gerät noch nicht dran waren. Ist der Vorrat leer, beginnt er von vorn. */
function draw(key, pool, n) {
  let seen = store.get("seen_" + key, []);
  let fresh = pool.map((_, i) => i).filter(i => !seen.includes(i));
  if (fresh.length < n) { seen = []; fresh = pool.map((_, i) => i); }
  const got = shuffle(fresh).slice(0, n);
  store.set("seen_" + key, seen.concat(got));
  return got.map(i => pool[i]);
}

  if (e.stage === "pass") {
    stage.innerHTML = `<div class="card">${head}
      <p><b>${esc(nameOf(e.cur))}</b> tippt jetzt. Alle anderen schauen weg.</p>
      <button class="btn" data-act="estgo">Ich bin ${esc(nameOf(e.cur))}</button></div>`;
  } else if (e.stage === "input") {
    stage.innerHTML = `<div class="card">${head}
      <div class="group"><label class="label" for="guess">${multi ? "Tipp von " + esc(nameOf(e.cur)) : "Dein Tipp"}${q.u ? " in " + q.u : ""}</label>
      <input class="big" type="text" id="guess" inputmode="numeric" autocomplete="off" placeholder="?"></div>
      <p class="hint" id="gerr" hidden>Bitte eine Zahl eintippen. Buchstaben zählen hier nicht.</p>
      <button class="btn" data-act="estok">Tipp abgeben</button></div>`;
    const inp = $("#guess"); if (inp) inp.focus({ preventScroll: true });
  } else {
    const show = n => q.year ? String(n) : fmt(n);
    const rows = G.players.map((p, i) => ({ i, name: p.name, g: e.guesses[i], d: Math.abs(e.guesses[i] - q.v), pts: e.points[i] })).sort((a, b) => a.d - b.d);
    stage.innerHTML = `<div class="card">${head}
      <div><span class="label">Richtig ist</span><div class="bignum">${show(q.v)}${q.u ? ` <small style="font-size:.4em">${q.u}</small>` : ""}</div></div>
      <div class="list">${rows.map(r => `<div class="line${r.pts > 0 ? " win" : ""}"><span class="who">${esc(r.name)}</span><span class="d">${r.d === 0 ? "exakt" : "daneben um " + show(r.d)}</span><span class="v">${show(r.g)}${r.pts ? " · +" + fmt(r.pts) : ""}</span></div>`).join("")}</div>
      <div class="fact"><b>Die Auflösung:</b> ${esc(q.f)}</div>
      <button class="btn" data-act="next">${isLast() ? "Zur Abrechnung" : "Weiter"}</button></div>`;
    const b = stage.querySelector('[data-act="next"]'); if (b) b.focus({ preventScroll: true });
  }
  renderScores();
}
function submitGuess() {
  const e = G.e, raw = ($("#guess").value || "").replace(/[.\s']/g, "").replace(",", ".");
  const val = Number(raw);
  if (raw === "" || !isFinite(val)) { $("#gerr").hidden = false; return; }
  e.guesses[e.cur] = Math.round(val);
  e.cur++;
  if (e.cur < G.players.length) { e.stage = "pass"; return renderEstimate(); }
  scoreEstimate();
}
function scoreEstimate() {
  const e = G.e, q = G.q, diffs = e.guesses.map(g => Math.abs(g - q.v));
  e.points = diffs.map(() => 0);
  let text;
  if (G.players.length > 1) {
    const best = Math.min(...diffs);
    const winners = diffs.map((d, i) => d === best ? i : -1).filter(i => i >= 0);
    winners.forEach(i => { e.points[i] = best === 0 ? 2000 : 1000; });
    const names = winners.map(nameOf).join(" und ");
    text = best === 0 ? LINES.estExact.replace("{n}", names) : line("estWin", names);
  } else {
    const d = diffs[0];
    e.points[0] = d === 0 ? 1500 : d <= q.tol ? 1000 : d <= q.tol * 3 ? 400 : 0;
    text = d === 0 ? LINES.estExact.replace("{n}", nameOf(0)) : pick(d <= q.tol ? LINES.estSoloGood : d <= q.tol * 3 ? LINES.estSoloMeh : LINES.estSoloBad);
  }
  e.points.forEach((p, i) => { G.players[i].score += p; });
  if (e.points.some(p => p > 0)) sfx.right(); else sfx.wrong();
  e.stage = "reveal";
  renderEstimate();
  say(text, text + " " + q.f);
}

/* ===================== ABRECHNUNG ===================== */
function showFinal() {
  stopTimer();
  const surv = G.mode === "surv", multi = G.players.length > 1;
  const rank = G.players.map(p => ({ ...p })).sort((a, b) => surv ? (b.lives - a.lives) || (b.score - a.score) : b.score - a.score);
  const top = rank[0];
  const tie = multi && rank[1] && (surv ? rank[1].lives === top.lives && rank[1].score === top.score : rank[1].score === top.score);
  let verdict, extra = "";
  if (surv && !multi) {
    const best = store.get("best", 0), now = top.score;
    if (now > best) store.set("best", now);
    extra = `<p class="hint">${now > best ? "Neuer Bestwert auf diesem Gerät." : "Bestwert auf diesem Gerät: " + best + "."}</p>`;
    verdict = top.lives > 0 ? `Du hast alle Fragen überlebt, ${top.name}. Ich habe keine mehr. Das ist mir noch nie passiert, und ich nehme es persönlich.`
      : now === 0 ? `Null richtige Antworten, ${top.name}. Das schafft man statistisch kaum. Respekt, auf eine Art.`
      : now < 8 ? `${now} richtige Antworten, dann war Schluss. Für einen Menschen ohne Vorbereitung und offenbar ohne Schulbildung ganz ordentlich.`
      : now < 20 ? `${now} richtige Antworten. Solide, ${top.name}. Du bist jetzt offiziell die Person, neben der auf Partys niemand sitzen will.`
      : `${now} richtige Antworten. ${top.name}, du brauchst dringend frische Luft. Aber gut gemacht.`;
  } else if (tie) {
    verdict = "Gleichstand an der Spitze. Ihr seid also alle gleich schlecht. Oder gleich gut, falls ihr das lieber hört.";
  } else if (multi) {
    const last = rank[rank.length - 1];
    verdict = surv ? `${top.name} hat als Letztes noch gestanden und gewinnt. ${last.name}, du warst auch da.`
      : top.score <= 0 ? `${top.name} gewinnt mit ${fmt(top.score)} Punkten. Gewinnen ist hier ein großes Wort. Ihr solltet euch alle schämen.`
      : `${top.name} gewinnt mit ${fmt(top.score)} Punkten. ${last.name}, ${last.score < 0 ? "du schuldest mir Geld" : "du warst bemüht"}.`;
  } else {
    const s = top.score, max = G.mode === "klassik" ? 17000 : G.mode === "wq" ? 6000 : 9000;
    verdict = s < 0 ? `${fmt(s)} Punkte, ${top.name}. Minuspunkte. Hättest du gar nichts gedrückt, wärst du besser gewesen.`
      : s < max * 0.35 ? `${fmt(s)} Punkte. Sagen wir so, ${top.name}: Dabei sein ist alles. Muss es in deinem Fall auch.`
      : s < max * 0.7 ? `${fmt(s)} Punkte. Ordentlich, ${top.name}. Nicht gut, nicht schlecht. Wie Kantinenessen.`
      : `${fmt(s)} Punkte! ${top.name}, entweder bist du schlau oder du hast die Fragen geschrieben. Glückwunsch.`;
  }
  const modeName = MODES[G.mode].name;
  stage.innerHTML = `<div class="card">
    <div class="eyebrow"><span>Abrechnung</span><span>${modeName}</span></div>
    <h2>${tie ? "Unentschieden" : multi ? esc(top.name) + " gewinnt" : "Feierabend"}</h2>
    <div class="list">${rank.map((p, i) => `<div class="line${i === 0 && !tie ? " win" : ""}"><span class="who">${i + 1}. ${esc(p.name)}</span><span class="d">${surv ? (p.lives > 0 ? p.lives + " Leben übrig" : "ausgeschieden") : ""}</span><span class="v">${surv ? p.score + " richtig" : fmt(p.score)}</span></div>`).join("")}</div>
    ${extra}
    <div class="row"><button class="btn" data-act="again">Nochmal</button><button class="btn ghost" data-act="menu">Anderer Modus</button></div>
  </div>`;
  G.c = null; G.done = true;
  $("#scores").hidden = true;
  sfx.start(); enter(); K.cue("final");
  say(verdict);
}

/* ===================== EINGABEN ===================== */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act === "voice") { S.voice = !S.voice; store.set("voice", S.voice); if (!S.voice) hush(); syncTools(); }
  else if (act === "sound") { S.sound = !S.sound; store.set("sound", S.sound); syncTools(); }
  else if (act === "quit" || act === "menu") showSetup(true);
  else if (act === "mode") { readNames(); setup.mode = v; showSetup(false); say(MODES[v].name + ". " + MODES[v].desc); }
  else if (act === "count") { readNames(); setup.n = Number(v); showSetup(false); }
  else if (act === "start" || act === "again") { if (act === "again") { G = null; } startGame(); }
  else if (act === "next") { hush(); nextQuestion(); }
  else if (act === "probe") { S.voice = true; store.set("voice", true); syncTools(); say("So klinge ich. Samtig, warm und völlig zu Recht von mir selbst begeistert."); }
  else if (act === "buzz") onBuzz(Number(v));
  else if (act === "ans") onAnswer(Number(v));
  else if (act === "estgo") { G.e.stage = "input"; renderEstimate(); }
  else if (act === "estok") submitGuess();
});
document.addEventListener("keydown", ev => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const inField = ev.target.tagName === "INPUT";
  if (inField) { if (ev.key === "Enter" && ev.target.id === "guess") { ev.preventDefault(); submitGuess(); } return; }
  if (!G || !G.c || G.c.phase === "reveal") return;
  const k = ev.key.toLowerCase();
  const b = BUZZ_KEYS.indexOf(k);
  if (b >= 0 && b < G.players.length && G.c.buzzMode && G.c.phase === "open") { ev.preventDefault(); return onBuzz(b); }
  if (/^[1-4]$/.test(k)) { ev.preventDefault(); onAnswer(Number(k) - 1); }
});
if ("speechSynthesis" in window) { try { speechSynthesis.getVoices(); speechSynthesis.addEventListener("voiceschanged", fillVoices); } catch {} }
document.addEventListener("change", ev => { if (ev.target.id === "voiceSel") store.set("voiceName", ev.target.value); });

syncTools();
showSetup(true);
</script>
