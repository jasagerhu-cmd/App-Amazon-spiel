<style>
/* Layout: eine zentrale Spielfläche (max 640px); das Produkt ist ein Preisschild-Etikett, die Preise stehen in Mono. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #16213a;
  --muted: #5b6680;
  --line: #d5dbe7;
  --tag: #ffcb3d;
  --tag-ink: #2a1f00;
  --accent: #2448d8;
  --accent-ink: #ffffff;
  --win: #128a4a;
  --danger: #c0392b;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1524; --surface: #18213a; --ink: #e8ecf6; --muted: #9aa5c0; --line: #2b3656;
    --tag: #ffcb3d; --tag-ink: #2a1f00; --accent: #6f8cff; --accent-ink: #0b1020; --win: #3ccf7f; --danger: #ff7a6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1524; --surface: #18213a; --ink: #e8ecf6; --muted: #9aa5c0; --line: #2b3656;
  --tag: #ffcb3d; --tag-ink: #2a1f00; --accent: #6f8cff; --accent-ink: #0b1020; --win: #3ccf7f; --danger: #ff7a6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
main { max-width: 640px; margin: 0 auto; display: grid; gap: 20px; }
header.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 2rem; margin: 0; letter-spacing: -0.02em; }
h1 span { background: var(--tag); color: var(--tag-ink); padding: 0 .3em; border-radius: 4px; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.meta { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.label { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
p { margin: 0; }
.hint { color: var(--muted); font-size: .9rem; }

/* Preisschild */
.tag {
  position: relative; background: var(--tag); color: var(--tag-ink);
  border-radius: 10px; padding: 24px 22px 22px 46px; display: grid; gap: 8px;
}
.tag::before {
  content: ""; position: absolute; left: 16px; top: 26px; width: 14px; height: 14px;
  border-radius: 50%; background: var(--bg); box-shadow: inset 0 0 0 2px rgba(0,0,0,.18);
}
.tag .emoji { font-size: 3.4rem; line-height: 1; }
.tag .photo { background: #fff; border-radius: 8px; height: 260px; max-width: 100%; display: grid; place-items: center; overflow: hidden; }
.tag .photo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.tag .cat { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; opacity: .7; }
.tag .name { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1.15; text-wrap: balance; overflow-wrap: anywhere; }
.tag .desc { font-size: .95rem; opacity: .85; }
.tag .price { font-family: var(--font-mono); font-weight: 700; font-size: 2.2rem; font-variant-numeric: tabular-nums; border-top: 2px dashed rgba(0,0,0,.25); padding-top: 10px; margin-top: 4px; }
.tag .price.hidden { letter-spacing: .1em; }

/* Formulare */
.field { display: grid; gap: 6px; }
input[type="text"], input[type="url"], select {
  font: inherit; font-size: 1rem; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; min-width: 0;
}
input.big { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, .drop:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.players { display: grid; gap: 8px; }
.player-row { display: flex; gap: 8px; }
.player-row input { flex: 1; }
.euro-row { display: flex; align-items: center; gap: 10px; }
.euro-row input { flex: 1; }
.euro-row span { font-family: var(--font-mono); font-size: 1.8rem; font-weight: 700; }
.check { display: flex; gap: 10px; align-items: center; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }

button {
  font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
}
button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
button.icon { padding: 0 14px; background: transparent; color: var(--muted); border: 1px solid var(--line); }
button:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.actions button.primary { flex: 1; font-size: 1.05rem; padding: 14px 18px; }
.error { color: var(--danger); font-size: .9rem; min-height: 1.2em; }
.ok { color: var(--win); font-size: .9rem; min-height: 1.2em; }

/* Bild-Ablage im Produkt-Editor */
.drop {
  border: 2px dashed var(--line); border-radius: 12px; min-height: 160px; display: grid; place-items: center;
  text-align: center; padding: 16px; color: var(--muted); cursor: pointer; background: var(--bg);
}
.drop.over { border-color: var(--accent); }
.drop img { max-height: 200px; max-width: 100%; object-fit: contain; border-radius: 6px; background: #fff; }
.plist { display: grid; gap: 8px; }
.pitem { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.pitem .thumb { width: 52px; height: 52px; flex: none; border-radius: 8px; background: #fff; display: grid; place-items: center; overflow: hidden; font-size: 1.6rem; }
.pitem .thumb img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pitem .info { flex: 1; min-width: 0; }
.pitem .info b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pitem .info span { font-family: var(--font-mono); font-size: .85rem; color: var(--muted); }

/* Übergabe-Bildschirm */
.handover { text-align: center; padding: 40px 20px; }
.handover .who { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; overflow-wrap: anywhere; }

/* Ergebnis */
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); }
th { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; font-family: var(--font-mono); white-space: nowrap; }
tr.winner td { color: var(--win); font-weight: 700; }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--win); color: var(--surface); margin-left: 6px; vertical-align: middle; }
.scroll { overflow-x: auto; }
.progress { display: flex; gap: 4px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--accent); }
.progress i.now { background: var(--tag); }
a { color: var(--accent); overflow-wrap: anywhere; }
.shot img { width: 100%; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); display: block; }
.shot .wait { aspect-ratio: 4 / 5; max-width: 100%; display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.gallery figure { margin: 0; display: grid; gap: 4px; min-width: 0; }
.gallery img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; }
.gallery figcaption { font-size: .8rem; overflow-wrap: anywhere; }
.podium { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; text-align: center; text-wrap: balance; }
footer { color: var(--muted); font-size: .8rem; text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .reveal { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.94); opacity: .4; } to { transform: scale(1); opacity: 1; } }
}
</style>

const $ = (sel) => document.querySelector(sel);

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
const eur = (v) => v.toLocaleString("de-DE", { style: "currency", currency: "EUR" });

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* "12,50" / "1.299" / "1.299,95" / "12.5" / "€ 40" -> Zahl oder NaN */
function parsePrice(raw) {
  let s = String(raw).replace(/[€\s]/g, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}

/* Aus einem Amazon-Link wie amazon.de/Sony-WH-1000XM5-Kopfhörer/dp/B09... einen Namen vorschlagen */
function nameFromLink(url) {
  try {
    const parts = new URL(url).pathname.split("/").filter(Boolean);
    const dp = parts.indexOf("dp");
    const slug = dp > 0 ? parts[dp - 1] : "";
    return slug ? decodeURIComponent(slug).replace(/-/g, " ").trim() : "";
  } catch { return ""; }
}

/* Bilddatei verkleinern (max 600 px) und als JPEG-Data-URL zurückgeben */
function imageFileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d");
      g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Bild nicht lesbar")); };
    img.src = url;
  });
}

function loadImage(src) {
  return new Promise((resolve) => {
    if (!src) return resolve(null);
    const img = new Image();
    if (!src.startsWith("data:")) img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

/* ---------- Eigene Produkte (im Browser gespeichert) ---------- */
const STORE_KEY = "preisraten.custom.v1";
function loadCustom() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "[]"); } catch { return []; }
}
function saveCustom(list) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); return true; } catch { return false; }
}
let custom = loadCustom();

/* ---------- Spielzustand ---------- */
let state = {
  screen: "setup",       // setup | products | intro | handover | guess | reveal | final
  players: ["Spieler 1", "Spieler 2"],
  scores: [],
  totalRounds: 10,
  useDefault: true,
  useCustom: true,
  deck: [],
  round: 0,
  guesses: [],
  history: [],           // pro Runde: { guesses, winners }
  turn: 0
};
const shots = {};        // Runde -> { url, blob }   (nicht im Snapshot)
let draft = { n: "", p: "", u: "", d: "", img: "" };

function pool() {
  return [...(state.useDefault ? PRODUCTS : []), ...(state.useCustom ? custom : [])];
}

function setStatus() {
  const s = state.screen;
  $("#status").textContent = ["setup", "products", "final"].includes(s) ? "" : `Runde ${state.round + 1} / ${state.totalRounds}`;
}

function progressBar() {
  let html = '<div class="progress" aria-hidden="true">';
  for (let i = 0; i < state.totalRounds; i++) html += `<i class="${i < state.round ? "done" : i === state.round ? "now" : ""}"></i>`;
  return html + "</div>";
}

function visual(prod) {
  return prod.img
    ? `<div class="photo"><img src="${esc(prod.img)}" alt="${esc(prod.n)}" data-emoji="${esc(prod.e || "🛒")}"></div>`
    : `<div class="emoji" aria-hidden="true">${prod.e || "🛒"}</div>`;
}

function tagCard(prod, priceHtml) {
  return `
    <div class="tag">
      ${visual(prod)}
      ${prod.c ? `<div class="cat">${esc(prod.c)}</div>` : ""}
      <div class="name">${esc(prod.n)}</div>
      ${prod.d ? `<div class="desc">${esc(prod.d)}</div>` : ""}
      ${priceHtml}
    </div>`;
}

/* Bilder, die nicht laden (z. B. gesperrte externe URL), durch das Emoji ersetzen */
function wireImageFallbacks() {
  app.querySelectorAll("img[data-emoji]").forEach((img) => {
    img.onerror = () => { const box = img.parentNode; box.outerHTML = `<div class="emoji" aria-hidden="true">${img.dataset.emoji}</div>`; };
  });
}

/* ---------- Ergebnisbild (Screenshot) ---------- */
function wrapLines(g, text, maxW, maxLines) {
  const words = String(text).split(/\s+/); const lines = []; let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (g.measureText(t).width <= maxW || !line) line = t; else { lines.push(line); line = w; }
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    lines.length = maxLines;
    let last = lines[maxLines - 1];
    while (g.measureText(last + "…").width > maxW && last.length) last = last.slice(0, -1);
    lines[maxLines - 1] = last + "…";
  }
  return lines;
}
function fit(g, text, maxW) {
  if (g.measureText(text).width <= maxW) return text;
  let t = text; while (t.length && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }

async function makeShot(r) {
  const prod = state.deck[r];
  const { guesses, winners } = state.history[r];
  const link = linkFor(prod);
  try { await document.fonts.ready; } catch {}
  const W = 1080, H = 1350, M = 60;
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const INK = "#2a1f00", WIN = "#0d7a3e";
  const fDisp = '"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif';
  const fMono = '"JetBrains Mono", ui-monospace, Menlo, monospace';
  const fBody = 'Inter, system-ui, "Segoe UI", sans-serif';

  g.fillStyle = "#ffcb3d"; g.fillRect(0, 0, W, H);
  g.fillStyle = INK; g.textBaseline = "alphabetic";
  g.font = `700 30px ${fMono}`;
  g.fillText(`PREIS-RATEN · RUNDE ${r + 1}/${state.totalRounds}`, M, 78);
  g.textAlign = "right"; g.fillText(new Date().toLocaleDateString("de-DE"), W - M, 78); g.textAlign = "left";

  // Bild
  const box = { x: M, y: 108, w: W - 2 * M, h: 440 };
  g.fillStyle = "#ffffff"; roundRect(g, box.x, box.y, box.w, box.h, 20); g.fill();
  const img = await loadImage(prod.img);
  let drawn = false;
  if (img) {
    try {
      const k = Math.min((box.w - 40) / img.width, (box.h - 40) / img.height);
      const w = img.width * k, h = img.height * k;
      g.drawImage(img, box.x + (box.w - w) / 2, box.y + (box.h - h) / 2, w, h);
      g.getImageData(0, 0, 1, 1); // wirft, falls das Bild das Canvas sperrt
      drawn = true;
    } catch { drawn = false; }
  }
  if (!drawn) {
    if (img) { g.fillStyle = "#ffffff"; roundRect(g, box.x, box.y, box.w, box.h, 20); g.fill(); }
    g.font = `220px system-ui, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = INK;
    g.fillText(prod.e || "🛒", W / 2, box.y + box.h / 2 + 10);
    g.textAlign = "left"; g.textBaseline = "alphabetic";
  }

  // Name + Preis
  g.fillStyle = INK; g.font = `800 52px ${fDisp}`;
  let y = 620;
  for (const line of wrapLines(g, prod.n, W - 2 * M, 2)) { g.fillText(line, M, y); y += 60; }
  g.font = `700 92px ${fMono}`;
  y += 54; g.fillText(eur(prod.p), M, y);
  y += 26;
  g.strokeStyle = "rgba(0,0,0,.3)"; g.setLineDash([12, 10]); g.lineWidth = 3;
  g.beginPath(); g.moveTo(M, y); g.lineTo(W - M, y); g.stroke(); g.setLineDash([]);

  // Tipps
  const qrSize = 210, listW = W - 2 * M - qrSize - 40;
  const order = state.players.map((_, i) => i).sort((a, b) => Math.abs(guesses[a] - prod.p) - Math.abs(guesses[b] - prod.p));
  const rowH = order.length > 6 ? 40 : 48;
  let ty = y + 56;
  for (const i of order) {
    const win = winners.includes(i);
    g.fillStyle = win ? WIN : INK;
    g.font = `${win ? 800 : 500} ${rowH - 12}px ${fBody}`;
    const price = eur(guesses[i]);
    g.font = `700 ${rowH - 12}px ${fMono}`;
    const pw = g.measureText(price).width;
    g.textAlign = "right"; g.fillText(price, M + listW, ty); g.textAlign = "left";
    g.font = `${win ? 800 : 500} ${rowH - 12}px ${fBody}`;
    g.fillText(fit(g, (win ? "★ " : "") + state.players[i], listW - pw - 24), M, ty);
    ty += rowH;
  }

  // QR-Code zum Artikel
  const qx = W - M - qrSize, qy = y + 24;
  if (window.qrcode) {
    try {
      const qr = qrcode(0, "M"); qr.addData(link); qr.make();
      const n = qr.getModuleCount(), pad = 12, cell = (qrSize - 2 * pad) / n;
      g.fillStyle = "#ffffff"; roundRect(g, qx, qy, qrSize, qrSize, 12); g.fill();
      g.fillStyle = "#000000";
      for (let row = 0; row < n; row++) for (let col = 0; col < n; col++)
        if (qr.isDark(row, col)) g.fillRect(qx + pad + col * cell, qy + pad + row * cell, Math.ceil(cell), Math.ceil(cell));
      g.fillStyle = INK; g.font = `600 22px ${fBody}`; g.textAlign = "center";
      g.fillText("Zum Artikel", qx + qrSize / 2, qy + qrSize + 30); g.textAlign = "left";
    } catch {}
  }

  // Link als Text
  g.fillStyle = INK; g.font = `500 24px ${fMono}`;
  g.fillText(fit(g, link.replace(/^https?:\/\/(www\.)?/, ""), W - 2 * M), M, H - 44);

  const url = c.toDataURL("image/png");
  const blob = await new Promise((res) => c.toBlob(res, "image/png"));
  return { url, blob };
}

/* ---------- Bildschirme ---------- */
function render() {
  setStatus();
  ({ setup, products, intro, handover, guess, reveal, final })[state.screen]();
  wireImageFallbacks();
}

function setup() {
  const rows = state.players.map((name, i) => `
    <div class="player-row">
      <input type="text" id="p${i}" value="${esc(name)}" maxlength="20" aria-label="Name Spieler ${i + 1}">
      <button class="icon" data-remove="${i}" ${state.players.length <= 1 ? "disabled" : ""} aria-label="Spieler entfernen">✕</button>
    </div>`).join("");

  app.innerHTML = `
    <section class="panel">
      <h2>Wer spielt mit?</h2>
      <p class="hint">Ihr seht ein Produkt ohne Preis. Jeder tippt geheim, was es kostet. Wer am nächsten dran ist, bekommt einen Punkt. Bei Gleichstand gibt es für alle einen.</p>
      <div class="players">${rows}</div>
      <div class="actions">
        <button class="ghost" id="add" ${state.players.length >= 8 ? "disabled" : ""}>+ Spieler hinzufügen</button>
      </div>
      <div class="field">
        <label class="label" for="rounds">Runden</label>
        <select id="rounds">
          ${[5, 10, 15, 20].map((n) => `<option value="${n}" ${n === state.totalRounds ? "selected" : ""}>${n} Runden</option>`).join("")}
        </select>
      </div>
    </section>
    <section class="panel">
      <h2>Produkte</h2>
      <label class="check"><input type="checkbox" id="useDefault" ${state.useDefault ? "checked" : ""}> Standardliste (${PRODUCTS.length} Produkte, ohne Fotos)</label>
      <label class="check"><input type="checkbox" id="useCustom" ${state.useCustom ? "checked" : ""}> Eigene Produkte mit Foto und Link (${custom.length})</label>
      <div class="actions"><button class="ghost" id="manage">Eigene Produkte verwalten</button></div>
    </section>
    <div class="error" id="err"></div>
    <div class="actions"><button class="primary" id="start">Spiel starten</button></div>`;

  const readForm = () => {
    state.players = state.players.map((_, i) => $("#p" + i).value);
    state.totalRounds = +$("#rounds").value;
    state.useDefault = $("#useDefault").checked;
    state.useCustom = $("#useCustom").checked;
  };
  $("#add").onclick = () => { readForm(); state.players.push(`Spieler ${state.players.length + 1}`); render(); $("#p" + (state.players.length - 1)).select(); };
  app.querySelectorAll("[data-remove]").forEach((b) => b.onclick = () => { readForm(); state.players.splice(+b.dataset.remove, 1); render(); });
  $("#manage").onclick = () => { readForm(); state.screen = "products"; render(); };
  $("#start").onclick = () => {
    readForm();
    const names = state.players.map((n) => n.trim());
    if (names.some((n) => !n)) { $("#err").textContent = "Jeder Spieler braucht einen Namen."; return; }
    if (new Set(names.map((n) => n.toLowerCase())).size !== names.length) { $("#err").textContent = "Zwei Spieler heißen gleich. Bitte unterschiedliche Namen vergeben."; return; }
    const available = pool();
    if (!available.length) { $("#err").textContent = "Keine Produkte ausgewählt. Hake die Standardliste an oder lege eigene Produkte an."; return; }
    state.players = names;
    state.totalRounds = Math.min(state.totalRounds, available.length);
    newGame(available);
  };
}

function newGame(available = pool()) {
  state.scores = state.players.map(() => 0);
  state.deck = shuffle(available).slice(0, state.totalRounds);
  state.history = [];
  for (const k in shots) delete shots[k];
  state.round = 0;
  state.screen = "intro";
  render();
}

function products() {
  const list = custom.map((p, i) => `
    <div class="pitem">
      <div class="thumb">${p.img ? `<img src="${esc(p.img)}" alt="">` : "🛒"}</div>
      <div class="info"><b>${esc(p.n)}</b><span>${eur(p.p)}</span></div>
      <button class="icon" data-del="${i}" aria-label="${esc(p.n)} löschen">✕</button>
    </div>`).join("");

  app.innerHTML = `
    <form class="panel" id="pf" autocomplete="off">
      <h2>Eigenes Produkt anlegen</h2>
      <p class="hint">So geht's: Artikel auf Amazon öffnen, Produktbild per Rechtsklick „Bild kopieren“ und hier einfügen (Strg+V / ⌘V), dann Link und Preis übernehmen. Auf dem Handy: Bild speichern und über „Bild wählen“ hochladen.</p>
      <div class="field">
        <span class="label">Produktbild</span>
        <div class="drop" id="drop" tabindex="0" role="button" aria-label="Bild einfügen, hierher ziehen oder auswählen">
          ${draft.img ? `<img src="${esc(draft.img)}" alt="Vorschau">` : "Bild einfügen (Strg+V), hierher ziehen<br>oder antippen zum Auswählen"}
        </div>
        <input type="file" id="file" accept="image/*" hidden>
      </div>
      <div class="field">
        <label class="label" for="du">Link zum Artikel (optional)</label>
        <input type="url" id="du" value="${esc(draft.u)}" placeholder="https://www.amazon.de/…/dp/…">
      </div>
      <div class="field">
        <label class="label" for="dn">Name</label>
        <input type="text" id="dn" value="${esc(draft.n)}" maxlength="120" placeholder="z. B. Sony WH-1000XM5">
      </div>
      <div class="grid2">
        <div class="field">
          <label class="label" for="dp">Preis in €</label>
          <input type="text" id="dp" inputmode="decimal" value="${esc(draft.p)}" placeholder="299,00">
        </div>
        <div class="field">
          <label class="label" for="dd">Kurzbeschreibung (optional)</label>
          <input type="text" id="dd" value="${esc(draft.d)}" maxlength="80">
        </div>
      </div>
      <div class="error" id="perr"></div>
      <div class="actions"><button class="primary" type="submit">Produkt speichern</button></div>
    </form>
    <section class="panel">
      <h2>Eigene Produkte (${custom.length})</h2>
      ${custom.length ? `<div class="plist">${list}</div>` : `<p class="hint">Noch keine. Sie werden nur in diesem Browser gespeichert.</p>`}
    </section>
    <div class="actions"><button class="primary" id="back">Fertig</button></div>`;

  const readDraft = () => { draft.n = $("#dn").value; draft.p = $("#dp").value; draft.u = $("#du").value; draft.d = $("#dd").value; };
  const setImage = async (file) => {
    if (!file || !file.type.startsWith("image/")) return;
    try { readDraft(); draft.img = await imageFileToDataUrl(file); render(); }
    catch { $("#perr").textContent = "Dieses Bild konnte nicht gelesen werden. Versuche ein JPG oder PNG."; }
  };
  const drop = $("#drop"), file = $("#file");
  drop.onclick = () => file.click();
  drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } };
  file.onchange = () => setImage(file.files[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); setImage(e.dataTransfer.files[0]); };
  $("#du").onchange = () => { if (!$("#dn").value.trim()) { const n = nameFromLink($("#du").value); if (n) $("#dn").value = n; } };

  app.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => {
    readDraft(); custom.splice(+b.dataset.del, 1); saveCustom(custom); render();
  });
  $("#pf").onsubmit = (ev) => {
    ev.preventDefault(); readDraft();
    const price = parsePrice(draft.p);
    const u = draft.u.trim();
    if (!draft.n.trim()) { $("#perr").textContent = "Bitte einen Namen eingeben."; return; }
    if (!isFinite(price) || price <= 0) { $("#perr").textContent = "Bitte einen gültigen Preis eingeben, z. B. 49,99."; return; }
    if (u && !/^https?:\/\//i.test(u)) { $("#perr").textContent = "Der Link muss mit https:// beginnen."; return; }
    custom.push({ e: "🛒", c: "", n: draft.n.trim(), d: draft.d.trim(), p: price, u: u || undefined, img: draft.img || undefined });
    if (!saveCustom(custom)) {
      custom.pop();
      $("#perr").textContent = "Speicher voll oder gesperrt. Lösche ein paar Produkte und versuche es erneut.";
      return;
    }
    draft = { n: "", p: "", u: "", d: "", img: "" };
    state.useCustom = true;
    render();
  };
  $("#back").onclick = () => { readDraft(); state.screen = "setup"; render(); };
}

/* Strg+V im Produkt-Editor: Bild aus der Zwischenablage übernehmen */
document.addEventListener("paste", async (e) => {
  if (state.screen !== "products") return;
  const item = [...(e.clipboardData?.items || [])].find((it) => it.type.startsWith("image/"));
  if (!item) return;
  e.preventDefault();
  try {
    draft.n = $("#dn").value; draft.p = $("#dp").value; draft.u = $("#du").value; draft.d = $("#dd").value;
    draft.img = await imageFileToDataUrl(item.getAsFile());
    render();
  } catch { $("#perr").textContent = "Das eingefügte Bild konnte nicht gelesen werden."; }
});

function intro() {
  const prod = state.deck[state.round];
  app.innerHTML = `
    ${progressBar()}
    <div class="reveal">${tagCard(prod, '<div class="price hidden">?? ,?? €</div>')}</div>
    <p class="hint">Alle schauen sich das Produkt an. Danach tippt jeder nacheinander geheim seinen Preis ein.</p>
    <div class="actions"><button class="primary" id="go">Schätzen beginnen</button></div>`;
  $("#go").onclick = () => { state.guesses = []; state.turn = 0; state.screen = state.players.length > 1 ? "handover" : "guess"; render(); };
}

function handover() {
  app.innerHTML = `
    ${progressBar()}
    <section class="panel handover">
      <p class="label">Gerät weitergeben an</p>
      <div class="who">${esc(state.players[state.turn])}</div>
      <p class="hint">Die anderen schauen weg.</p>
      <div class="actions"><button class="primary" id="ready">Ich bin ${esc(state.players[state.turn])}</button></div>
    </section>`;
  $("#ready").onclick = () => { state.screen = "guess"; render(); };
}

function guess() {
  const prod = state.deck[state.round];
  const name = state.players[state.turn];
  app.innerHTML = `
    ${progressBar()}
    ${tagCard(prod, "")}
    <form class="panel" id="f" autocomplete="off">
      <label class="label" for="g">${esc(name)}, was kostet das?</label>
      <div class="euro-row">
        <input class="big" id="g" type="text" inputmode="decimal" placeholder="0,00">
        <span aria-hidden="true">€</span>
      </div>
      <div class="error" id="err"></div>
      <div class="actions"><button class="primary" type="submit">Schätzung abgeben</button></div>
    </form>`;
  $("#g").focus();
  $("#f").onsubmit = (ev) => {
    ev.preventDefault();
    const v = parsePrice($("#g").value);
    if (!isFinite(v) || v < 0) { $("#err").textContent = "Bitte einen Betrag eingeben, z. B. 49,99."; return; }
    if (v > 1000000) { $("#err").textContent = "Maximal 1.000.000 €."; return; }
    state.guesses[state.turn] = v;
    state.turn++;
    if (state.turn < state.players.length) state.screen = "handover";
    else { scoreRound(); state.screen = "reveal"; }
    render();
  };
}

function scoreRound() {
  const price = state.deck[state.round].p;
  const diffs = state.guesses.map((g) => Math.abs(g - price));
  const best = Math.min(...diffs);
  const winners = diffs.map((d, i) => (Math.abs(d - best) < 0.005 ? i : -1)).filter((i) => i >= 0);
  winners.forEach((i) => state.scores[i]++);
  state.history[state.round] = { guesses: state.guesses.slice(), winners };
}

function reveal() {
  const r = state.round;
  const prod = state.deck[r];
  const price = prod.p;
  const { guesses, winners } = state.history[r];
  const order = state.players.map((_, i) => i).sort((a, b) => Math.abs(guesses[a] - price) - Math.abs(guesses[b] - price));
  const rows = order.map((i) => {
    const g = guesses[i], diff = g - price;
    const pct = price > 0 ? Math.round((diff / price) * 100) : 0;
    const win = winners.includes(i);
    return `<tr class="${win ? "winner" : ""}">
      <td>${esc(state.players[i])}${win ? '<span class="pill">+1</span>' : ""}</td>
      <td class="num">${eur(g)}</td>
      <td class="num">${diff >= 0 ? "+" : "−"}${eur(Math.abs(diff))}</td>
      <td class="num">${pct >= 0 ? "+" : "−"}${Math.abs(pct)} %</td>
    </tr>`;
  }).join("");
  const last = r + 1 >= state.totalRounds;
  const link = linkFor(prod);

  app.innerHTML = `
    ${progressBar()}
    <div class="reveal">${tagCard(prod, `<div class="price">${eur(price)}</div>`)}</div>
    <section class="panel">
      <h2>${winners.length > 1 ? "Gleichstand!" : esc(state.players[winners[0]]) + " war am nächsten dran"}</h2>
      <div class="scroll"><table>
        <thead><tr><th>Spieler</th><th class="num">Tipp</th><th class="num">Abstand</th><th class="num">%</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="hint"><a href="${esc(link)}" target="_blank" rel="noopener">${prod.u ? "Zum Artikel ↗" : "Aktuellen Preis online nachschauen ↗"}</a></p>
    </section>
    <section class="panel shot">
      <p class="label">Ergebnisbild dieser Runde</p>
      <div id="shotbox"><div class="wait">Bild wird erstellt …</div></div>
      <div class="actions" id="shotactions" hidden>
        <button class="ghost" id="dl">Bild speichern</button>
        <button class="ghost" id="cp">Bild kopieren</button>
        <button class="ghost" id="sh" hidden>Teilen</button>
      </div>
      <p class="hint" id="shothint">Klappt der Knopf nicht: Bild gedrückt halten (Handy) oder Rechtsklick → „Bild speichern“.</p>
      <div class="ok" id="shotmsg"></div>
    </section>
    ${scoreboard()}
    <div class="actions"><button class="primary" id="next">${last ? "Zum Endergebnis" : "Nächste Runde"}</button></div>`;

  $("#next").onclick = () => {
    if (last) state.screen = "final"; else { state.round++; state.screen = "intro"; }
    render(); window.scrollTo(0, 0);
  };
  showShot(r);
}

async function showShot(r) {
  if (!shots[r]) {
    try { shots[r] = await makeShot(r); }
    catch { const box = $("#shotbox"); if (box) box.innerHTML = '<p class="error">Das Ergebnisbild konnte nicht erstellt werden.</p>'; return; }
  }
  if (state.screen !== "reveal" || state.round !== r || !$("#shotbox")) return;
  const { url, blob } = shots[r];
  const fileName = `preis-raten-runde-${r + 1}.png`;
  $("#shotbox").innerHTML = `<img src="${url}" alt="Ergebnisbild Runde ${r + 1}: ${esc(state.deck[r].n)}, ${eur(state.deck[r].p)}">`;
  $("#shotactions").hidden = false;
  const msg = (t) => { $("#shotmsg").textContent = t; };
  $("#dl").onclick = () => {
    const a = document.createElement("a"); a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
  };
  $("#cp").onclick = () => {
    if (!navigator.clipboard?.write || !window.ClipboardItem) { msg("Kopieren wird hier nicht unterstützt. Halte das Bild gedrückt oder nutze Rechtsklick."); return; }
    navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
      .then(() => msg("Bild kopiert. Du kannst es jetzt z. B. in WhatsApp einfügen."))
      .catch(() => msg("Kopieren wurde blockiert. Halte das Bild gedrückt oder nutze Rechtsklick."));
  };
  const file = new File([blob], fileName, { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    $("#sh").hidden = false;
    $("#sh").onclick = () => navigator.share({ files: [file], title: state.deck[r].n, text: linkFor(state.deck[r]) }).catch(() => {});
  }
}

function scoreboard(title = "Punktestand") {
  const order = state.players.map((_, i) => i).sort((a, b) => state.scores[b] - state.scores[a]);
  const top = Math.max(...state.scores);
  return `<section class="panel">
    <p class="label">${title}</p>
    <table><tbody>${order.map((i) => `<tr class="${state.scores[i] === top && top > 0 ? "winner" : ""}"><td>${esc(state.players[i])}</td><td class="num">${state.scores[i]}</td></tr>`).join("")}</tbody></table>
  </section>`;
}

function final() {
  const top = Math.max(...state.scores);
  const champs = state.players.filter((_, i) => state.scores[i] === top);
  const headline = state.players.length === 1
    ? `${top} von ${state.totalRounds} Treffern`
    : champs.length > 1 ? `Unentschieden: ${champs.map(esc).join(" & ")}` : `🏆 ${esc(champs[0])} gewinnt!`;
  const gallery = state.deck.map((prod, r) => `
    <figure>
      ${shots[r] ? `<img src="${shots[r].url}" alt="Ergebnisbild Runde ${r + 1}">` : ""}
      <figcaption>${r + 1}. <a href="${esc(linkFor(prod))}" target="_blank" rel="noopener">${esc(prod.n)}</a> · ${eur(prod.p)}</figcaption>
    </figure>`).join("");
  app.innerHTML = `
    <section class="panel">
      <p class="label">Endergebnis nach ${state.totalRounds} Runden</p>
      <div class="podium">${headline}</div>
    </section>
    ${scoreboard("Tabelle")}
    <section class="panel">
      <p class="label">Alle Produkte dieses Spiels</p>
      <div class="gallery">${gallery}</div>
    </section>
    <div class="actions">
      <button class="primary" id="again">Nochmal mit denselben Spielern</button>
      <button class="ghost" id="new">Neues Spiel einrichten</button>
    </div>`;
  $("#again").onclick = () => newGame();
  $("#new").onclick = () => { state.screen = "setup"; render(); };
}

/* Spielstand bei Seiten-Updates im Claude-Viewer behalten (außerhalb wirkungslos) */
window.claude?.hot?.snapshot?.(() => state);
const start = (data) => { if (data && data.screen) state = Object.assign(state, data, { history: data.history || [] }); render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
