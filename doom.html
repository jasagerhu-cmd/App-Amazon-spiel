<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grinse-Invasion</title>
<style>
  :root { --red:#e8331c; --amber:#ffb020; --bg:#0a0505; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:#eee;
    font-family: Impact, "Arial Black", system-ui, sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas#gl { display:block; position:fixed; inset:0; width:100%; height:100%; }
  #cross { position:fixed; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; pointer-events:none; }
  #cross::before,#cross::after { content:""; position:absolute; background:rgba(255,255,255,.85); box-shadow:0 0 3px #000; }
  #cross::before { left:10px; top:0; width:2px; height:22px; }
  #cross::after { top:10px; left:0; height:2px; width:22px; }
  #hitmark { position:fixed; left:50%; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; pointer-events:none; opacity:0;
    border:3px solid var(--red); border-radius:50%; transition:opacity .15s; }
  #dmg { position:fixed; inset:0; pointer-events:none; opacity:0;
    background: radial-gradient(ellipse at center, rgba(255,0,0,0) 40%, rgba(200,0,0,.75) 100%); }
  #bar { position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; gap:4px; padding:6px;
    background:linear-gradient(#2b2b2b,#141414); border-top:3px solid #555; pointer-events:none; }
  #bar .c { min-width:84px; text-align:center; padding:2px 10px; background:#1b1b1b; border:2px inset #444; }
  #bar b { display:block; font-size:30px; line-height:1; color:var(--red); text-shadow:0 2px 0 #400; letter-spacing:1px; }
  #bar span { font-size:11px; color:#aaa; letter-spacing:2px; }
  #bar .c.low b { animation: blink .5s steps(2) infinite; }
  @keyframes blink { 50% { color:#fff; } }
  #msg { position:fixed; top:16%; left:0; right:0; text-align:center; font-size:44px; color:var(--amber);
    text-shadow:0 3px 0 #000, 0 0 18px rgba(255,80,0,.6); pointer-events:none; opacity:0; transition:opacity .3s; padding:0 16px; }
  #mini { position:fixed; top:10px; left:10px; width:150px; height:150px; opacity:.8; pointer-events:none; border:2px solid #444; background:rgba(0,0,0,.5); }
  #overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at center, rgba(60,0,0,.75), rgba(0,0,0,.92)); text-align:center; padding:16px; z-index:10; }
  #overlay h1 { margin:0; font-size:clamp(40px,10vw,96px); color:var(--red); letter-spacing:3px;
    text-shadow:0 5px 0 #400, 0 0 30px rgba(255,40,0,.6); transform:skewX(-6deg); }
  #overlay img { width:120px; filter:drop-shadow(0 0 20px rgba(255,0,0,.7)); animation: wobble 1.2s ease-in-out infinite; }
  @keyframes wobble { 0%,100%{ transform:rotate(-8deg) scale(1);} 50%{ transform:rotate(8deg) scale(1.08);} }
  #overlay p { margin:0; font-family:system-ui,sans-serif; color:#ccc; max-width:520px; line-height:1.5; }
  #overlay button { font:inherit; font-size:26px; padding:12px 34px; color:#fff; background:var(--red); border:0; border-radius:4px;
    box-shadow:0 5px 0 #6a0d00; cursor:pointer; letter-spacing:2px; }
  #overlay button:disabled { opacity:.5; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 2px 0 #6a0d00; }
  .keys { font-family:ui-monospace,monospace; font-size:13px; color:#999; }
  /* Touch */
  .touch { display:none; }
  body.is-touch .touch { display:block; }
  body.is-touch #mini { width:110px; height:110px; }
  #joy { position:fixed; left:24px; bottom:90px; width:120px; height:120px; border-radius:50%; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06); pointer-events:none; }
  #joyKnob { position:absolute; left:35px; top:35px; width:50px; height:50px; border-radius:50%; background:rgba(255,255,255,.3); }
  .tbtn { position:fixed; border-radius:50%; background:rgba(232,51,28,.45); border:2px solid rgba(255,255,255,.4); color:#fff;
    display:flex !important; align-items:center; justify-content:center; font-size:14px; letter-spacing:1px; }
  body:not(.is-touch) .tbtn { display:none !important; }
  #fireBtn { right:24px; bottom:96px; width:92px; height:92px; }
  #swapBtn { right:128px; bottom:110px; width:56px; height:56px; background:rgba(80,80,80,.5); }
  #jumpBtn { right:40px; bottom:200px; width:56px; height:56px; background:rgba(80,80,80,.5); }
  @media (max-width:600px){ #bar .c{min-width:0; padding:2px 6px;} #bar b{font-size:22px;} #bar span{font-size:9px; letter-spacing:1px;} #msg{font-size:30px;} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="mini" width="150" height="150"></canvas>
<div id="cross"></div>
<div id="hitmark"></div>
<div id="dmg"></div>
<div id="msg"></div>
<div id="bar">
  <div class="c" id="hpBox"><b id="hp">100</b><span>GESUNDHEIT</span></div>
  <div class="c" id="ammoBox"><b id="ammo">0</b><span id="wname">SCHROT</span></div>
  <div class="c"><b id="wave">1</b><span>WELLE</span></div>
  <div class="c"><b id="kills">0</b><span>KILLS</span></div>
  <div class="c"><b id="score">0</b><span>PUNKTE</span></div>
</div>
<div id="joy" class="touch"><div id="joyKnob"></div></div>
<div id="fireBtn" class="tbtn">FEUER</div>
<div id="swapBtn" class="tbtn">WAFFE</div>
<div id="jumpBtn" class="tbtn">SPRUNG</div>

<div id="overlay">
  <img id="ovFace" alt="">
  <h1 id="ovTitle">GRINSE-INVASION</h1>
  <p id="ovText">Sie grinsen. Sie kommen in Wellen. Sie haben alle dasselbe Gesicht.<br>Halte so lange durch wie möglich.</p>
  <button id="ovBtn" disabled>LÄDT…</button>
  <div class="keys" id="ovKeys">WASD bewegen · Maus zielen · Klick schießen · Shift rennen · Leertaste springen · 1/2 oder Mausrad Waffe</div>
</div>

};

function castGrid(ox, oz, dx, dz, max) {

    } catch (e) { AC = null; }

}
function sNoise(dur, freq, vol, freqEnd) {

}

function makeFaceTextures(img) {

    const pos = p.s.position;
    if (Math.random() < .5) burst(pos, 1, 'fire', .8, .1, .35);
    let hit = p.life <= 0 || solid(pos.x, pos.z) || pos.y < 0 || pos.y > WALL_H;
    if (!hit && Math.hypot(pos.x - player.x, pos.z - player.z) < .6 && pos.y > player.y && pos.y < player.y + EYE + .4) { hurtPlayer(p.dmg); hit = true; }
    if (hit) {
      burst(pos, 14, 'fire', 4, .12, .5); SFX.boom();
      scene.remove(p.s); projectiles.splice(i, 1);
    }
  }
}

// ---------------------------------------------------------------- Pickups
const pickups = [];
const pickupGeo = new THREE.BoxGeometry(.6, .45, .6);
const pickupMats = { health: new THREE.MeshPhongMaterial({ map: TEX.medkit, emissive: 0x331111 }), ammo: new THREE.MeshPhongMaterial({ map: TEX.ammo, emissive: 0x222200 }) };
function spawnPickup(kind, x, z) {
  if (solid(x, z)) return;
  const m = new THREE.Mesh(pickupGeo, pickupMats[kind]); m.position.set(x, .5, z); scene.add(m);
  pickups.push({ m, kind, t: Math.random() * 6 });
}
function updatePickups(dt) {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i]; p.t += dt; p.m.rotation.y += dt * 2; p.m.position.y = .45 + Math.sin(p.t * 3) * .12;
    if (Math.hypot(p.m.position.x - player.x, p.m.position.z - player.z) < 1.2) {
      if (p.kind === 'health') { if (player.hp >= 100) continue; player.hp = Math.min(100, player.hp + 25); showMsg('+25 GESUNDHEIT', 900); }
      else { WEAPONS[0].ammo = Math.min(WEAPONS[0].max, WEAPONS[0].ammo + 10); WEAPONS[1].ammo = Math.min(WEAPONS[1].max, WEAPONS[1].ammo + 60); showMsg('+MUNITION', 900); }
      SFX.pickup(); scene.remove(p.m); pickups.splice(i, 1); updateHud();
    }
  }
}

// ---------------------------------------------------------------- Spieler & Spielzustand
const player = { x: 0, z: 0, y: 0, vy: 0, yaw: 0, pitch: 0, hp: 100, r: .4 };
const game = { state: 'menu', wave: 0, kills: 0, score: 0, combo: 0, queue: [], spawnT: 0, waveDelay: 0, cooldown: 0, weapon: 0,
  recoil: 0, flashT: 0, shake: 0, bob: 0, firing: false, best: 0 };
try { game.best = +localStorage.getItem('grinse-best') || 0; } catch (e) {}

function resetGame() {
  for (const e of enemies) scene.remove(e.g); enemies.length = 0;
  for (const p of projectiles) scene.remove(p.s); projectiles.length = 0;
  for (const p of pickups) scene.remove(p.m); pickups.length = 0;
  Object.assign(player, { x: (startCell.x + .5) * CELL, z: (startCell.z + .5) * CELL, y: 0, vy: 0, yaw: -Math.PI * .75, pitch: 0, hp: 100 });
  WEAPONS[0].ammo = 30; WEAPONS[1].ammo = 150;
  Object.assign(game, { wave: 0, kills: 0, score: 0, queue: [], spawnT: 0, waveDelay: 1.2, cooldown: 0, weapon: 0, recoil: 0, shake: 0 });
  selectWeapon(0, true); updateHud();
}
function startWave() {
  game.wave++;
  const n = game.wave, q = [];
  const total = 5 + n * 3;
  const brutes = n >= 3 ? Math.floor((n - 1) / 2) : 0;
  for (let i = 0; i < total - brutes; i++) q.push(n >= 2 && Math.random() < Math.min(.45, .2 + n * .04) ? 'runner' : 'imp');
  for (let i = 0; i < brutes; i++) q.splice(Math.floor(rnd(q.length * .4, q.length)), 0, 'brute');
  game.queue = q; game.spawnT = .5;
  showMsg('WELLE ' + n, 1800); SFX.wave(); updateHud();
}
function trySpawn() {
  const alive = enemies.filter(e => !e.dead).length;
  if (alive >= 14) return;
  const far = spawnCells.filter(c => Math.hypot((c.x + .5) * CELL - player.x, (c.z + .5) * CELL - player.z) > 14);
  const pool = far.length ? far : spawnCells;
  const c = pool[Math.floor(Math.random() * pool.length)];
  const x = (c.x + .5) * CELL + rnd(-.8, .8), z = (c.z + .5) * CELL + rnd(-.8, .8);
  enemies.push(new Enemy(game.queue.shift(), x, z));
  burst(new THREE.Vector3(x, 1.2, z), 26, 'green', 4, .12, .9);
  if (Math.hypot(x - player.x, z - player.z) < 30) SFX.spawn();
}
function hurtPlayer(n, src) {
  if (game.state !== 'play') return;
  player.hp -= n; game.shake = Math.min(1, game.shake + n / 20); game.combo = 0;
  dmgEl.style.opacity = Math.min(1, .35 + n / 20); SFX.hurt();
  if (player.hp <= 0) { player.hp = 0; gameOver(); }
  updateHud();
}

// ---------------------------------------------------------------- Schießen
const _v = new THREE.Vector3(), _r = new THREE.Vector3(), _u = new THREE.Vector3(), _f = new THREE.Vector3();
function selectWeapon(i, silent) {
  game.weapon = i; WEAPONS.forEach((w, k) => w.model.visible = k === i);
  if (!silent) { SFX.swap(); game.recoil = 1.4; }
  updateHud();
}
function fire() {
  const w = WEAPONS[game.weapon];
  if (game.cooldown > 0) return;
  if (w.ammo <= 0) {
    SFX.empty(); game.cooldown = .3;
    const other = WEAPONS[1 - game.weapon]; if (other.ammo > 0) selectWeapon(1 - game.weapon);
    return;
  }
  w.ammo--; game.cooldown = w.rate; game.recoil = Math.min(1.5, game.recoil + w.kick); game.flashT = .055;
  muzzle.material.rotation = Math.random() * 6; muzzle.position.z = game.weapon === 0 ? -.85 : -.75;
  (game.weapon === 0 ? SFX.shotgun : SFX.minigun)();
  camera.updateMatrixWorld();
  _r.setFromMatrixColumn(camera.matrixWorld, 0); _u.setFromMatrixColumn(camera.matrixWorld, 1); _f.setFromMatrixColumn(camera.matrixWorld, 2).negate();
  const origin = new THREE.Vector3(); camera.getWorldPosition(origin);
  let anyHit = false;
  for (let i = 0; i < w.pellets; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.sqrt(Math.random()) * w.spread;
    _v.copy(_f).addScaledVector(_r, Math.cos(a) * s).addScaledVector(_u, Math.sin(a) * s).normalize();
    if (hitscan(origin, _v, w.dmg)) anyHit = true;
  }
  if (anyHit) { hitEl.style.opacity = 1; setTimeout(() => hitEl.style.opacity = 0, 80); }
  if (game.weapon === 1) player.pitch += .004; // leichter Rückstoß
  updateHud();
}
function hitscan(o, d, dmg) {
  let tMax = 120;
  const hl = Math.hypot(d.x, d.z);
  if (hl > 1e-6) tMax = castGrid(o.x, o.z, d.x / hl, d.z / hl, 120) / hl;
  if (d.y < 0) tMax = Math.min(tMax, -o.y / d.y);
  if (d.y > 0) tMax = Math.min(tMax, (WALL_H - o.y) / d.y);
  let best = null, bt = tMax;
  for (const e of enemies) {
    if (e.dead || e.spawnT > 0) continue;
    const r = .55 * e.s, top = 3.25 * e.s;
    const t = rayBox(o, d, e.x - r, 0, e.z - r, e.x + r, top, e.z + r);
    if (t !== null && t < bt) { bt = t; best = e; }
  }
  const hit = o.clone().addScaledVector(d, bt);
  if (best) {
    const head = hit.y > 1.85 * best.s;
    best.damage(dmg * (head ? 2 : 1), d);
    burst(hit, head ? 10 : 6, 'blood', 3.5, .09, .9);
    return true;
  }
  hit.addScaledVector(d, -.05);
  burst(hit, 4, 'spark', 3, .05, .3); burst(hit, 3, 'dust', 1.5, .07, .5);
  return false;
}
function rayBox(o, d, x0, y0, z0, x1, y1, z1) {
  let tmin = 0, tmax = Infinity;
  for (const [oo, dd, a, b] of [[o.x, d.x, x0, x1], [o.y, d.y, y0, y1], [o.z, d.z, z0, z1]]) {
    if (Math.abs(dd) < 1e-9) { if (oo < a || oo > b) return null; continue; }
    let t1 = (a - oo) / dd, t2 = (b - oo) / dd; if (t1 > t2) [t1, t2] = [t2, t1];
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if (tmin > tmax) return null;
  }
  return tmin;
}

// ---------------------------------------------------------------- Eingabe
const keys = {};
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (isTouch) document.body.classList.add('is-touch');
let locked = false, dragLook = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (game.state !== 'play') return;
  if (e.code === 'Digit1') selectWeapon(0);
  if (e.code === 'Digit2') selectWeapon(1);
  if (e.code === 'KeyQ') selectWeapon(1 - game.weapon);
  if (e.code === 'Space') { jump(); e.preventDefault(); }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('wheel', e => { if (game.state === 'play') selectWeapon(1 - game.weapon); }, { passive: true });
canvas.addEventListener('mousedown', e => {
  if (isTouch || game.state !== 'play') return;
  if (!locked && !dragLook) { requestLock(); }
  if (e.button === 0) { game.firing = true; fire(); }
});
addEventListener('mouseup', e => { if (e.button === 0) game.firing = false; });
addEventListener('mousemove', e => {
  if (game.state !== 'play' || isTouch) return;
  if (locked || (dragLook && e.buttons)) look(e.movementX, e.movementY, .0022);
});
function look(dx, dy, sens) {
  player.yaw -= dx * sens; player.pitch -= dy * sens;
  player.pitch = Math.max(-1.45, Math.min(1.45, player.pitch));
}
function requestLock() {
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => { dragLook = true; }); } catch (e) { dragLook = true; }
}
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  if (!locked && game.state === 'play' && !isTouch && !dragLook) pause();
});
document.addEventListener('pointerlockerror', () => { dragLook = true; });
function jump() { if (player.y <= 0.001) player.vy = 6.5; }

// Touch-Steuerung
const touch = { moveId: null, mx: 0, my: 0, ox: 0, oy: 0, lookId: null, lx: 0, ly: 0 };
const joy = document.getElementById('joy'), knob = document.getElementById('joyKnob');
function onTouchStart(e) {
  if (game.state !== 'play') return;
  for (const t of e.changedTouches) {
    const el = t.target;
    if (el.id === 'fireBtn') { game.firing = true; fire(); touch.fireId = t.identifier; continue; }
    if (el.id === 'swapBtn') { selectWeapon(1 - game.weapon); continue; }
    if (el.id === 'jumpBtn') { jump(); continue; }
    if (t.clientX < innerWidth * .45 && touch.moveId === null) {
      touch.moveId = t.identifier; touch.ox = t.clientX; touch.oy = t.clientY; touch.mx = touch.my = 0;
      joy.style.left = (t.clientX - 60) + 'px'; joy.style.top = (t.clientY - 60) + 'px'; joy.style.bottom = 'auto';
    } else if (touch.lookId === null) { touch.lookId = t.identifier; touch.lx = t.clientX; touch.ly = t.clientY; }
  }
  e.preventDefault();
}
function onTouchMove(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.moveId) {
      let dx = t.clientX - touch.ox, dy = t.clientY - touch.oy; const l = Math.hypot(dx, dy), m = 50;
      if (l > m) { dx *= m / l; dy *= m / l; }
      touch.mx = dx / m; touch.my = dy / m; knob.style.transform = `translate(${dx}px,${dy}px)`;
    } else if (t.identifier === touch.lookId) {
      look(t.clientX - touch.lx, t.clientY - touch.ly, .0055); touch.lx = t.clientX; touch.ly = t.clientY;
    }
  }
  e.preventDefault();
}
function onTouchEnd(e) {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.moveId) { touch.moveId = null; touch.mx = touch.my = 0; knob.style.transform = ''; }
    if (t.identifier === touch.lookId) touch.lookId = null;
    if (t.identifier === touch.fireId) { game.firing = false; touch.fireId = null; }
  }
}
addEventListener('touchstart', onTouchStart, { passive: false });
addEventListener('touchmove', onTouchMove, { passive: false });
addEventListener('touchend', onTouchEnd); addEventListener('touchcancel', onTouchEnd);

// ---------------------------------------------------------------- HUD
const $ = id => document.getElementById(id);
const dmgEl = $('dmg'), hitEl = $('hitmark'), msgEl = $('msg'), mini = $('mini').getContext('2d');
let msgTimer = 0;
function showMsg(t, ms) { msgEl.textContent = t; msgEl.style.opacity = 1; clearTimeout(msgTimer); msgTimer = setTimeout(() => msgEl.style.opacity = 0, ms); }
function updateHud() {
  $('hp').textContent = Math.ceil(player.hp); $('hpBox').classList.toggle('low', player.hp <= 25);
  const w = WEAPONS[game.weapon]; $('ammo').textContent = w.ammo; $('wname').textContent = w.name; $('ammoBox').classList.toggle('low', w.ammo <= (game.weapon ? 20 : 4));
  $('wave').textContent = game.wave; $('kills').textContent = game.kills; $('score').textContent = game.score;
}
function drawMinimap() {
  const c = mini.canvas, s = c.width / Math.max(W, H);
  mini.clearRect(0, 0, c.width, c.height);
  for (let z = 0; z < H; z++) for (let x = 0; x < W; x++) {
    const v = grid[z * W + x]; if (!v) continue;
    mini.fillStyle = v === 2 ? '#4a6870' : '#6a3020'; mini.fillRect(x * s, z * s, s, s);
  }
  mini.fillStyle = '#ff2a10';
  for (const e of enemies) if (!e.dead) { mini.beginPath(); mini.arc(e.x / CELL * s, e.z / CELL * s, e.type === 'brute' ? 3.5 : 2.2, 0, 7); mini.fill(); }
  mini.fillStyle = '#4dff7a';
  for (const p of pickups) mini.fillRect(p.m.position.x / CELL * s - 1.5, p.m.position.z / CELL * s - 1.5, 3, 3);
  const px = player.x / CELL * s, pz = player.z / CELL * s;
  mini.save(); mini.translate(px, pz); mini.rotate(-player.yaw);
  mini.fillStyle = '#fff'; mini.beginPath(); mini.moveTo(0, -5); mini.lineTo(3.5, 4); mini.lineTo(-3.5, 4); mini.fill(); mini.restore();
}

// ---------------------------------------------------------------- Overlay / Zustände
const ov = $('overlay'), ovBtn = $('ovBtn'), ovTitle = $('ovTitle'), ovText = $('ovText');
if (isTouch) $('ovKeys').textContent = 'Links ziehen: laufen · Rechts ziehen: zielen · Buttons: Feuer, Waffe, Sprung';
function startGame() {
  audio();
  if (game.state === 'menu' || game.state === 'dead') resetGame();
  game.state = 'play'; ov.style.display = 'none';
  if (!isTouch) requestLock();
  last = performance.now();
}
function pause() {
  game.state = 'paused'; game.firing = false;
  ovTitle.textContent = 'PAUSE'; ovText.innerHTML = 'Die Grinser warten auf dich.'; ovBtn.textContent = 'WEITER';
  ov.style.display = 'flex';
}
function gameOver() {
  game.state = 'dead'; game.firing = false;
  if (document.pointerLockElement) document.exitPointerLock();
  const rec = game.score > game.best; if (rec) { game.best = game.score; try { localStorage.setItem('grinse-best', game.best); } catch (e) {} }
  ovTitle.textContent = 'DU WURDEST WEGGEGRINST';
  ovText.innerHTML = `Welle <b>${game.wave}</b> · <b>${game.kills}</b> Kills · <b>${game.score}</b> Punkte<br>${rec ? '🏆 Neuer Rekord!' : 'Rekord: ' + game.best}`;
  ovBtn.textContent = 'NOCHMAL';
  setTimeout(() => ov.style.display = 'flex', 700);
}
ovBtn.addEventListener('click', startGame);
addEventListener('keydown', e => { if ((e.code === 'Enter') && game.state !== 'play' && !ovBtn.disabled) startGame(); if (e.code === 'Escape' && game.state === 'play' && dragLook) pause(); });

// ---------------------------------------------------------------- Hauptschleife
let last = performance.now(), flowT = 0;
function step(dt) {
  // Bewegung
  let fwd = 0, side = 0;
  if (keys.KeyW || keys.ArrowUp) fwd += 1; if (keys.KeyS || keys.ArrowDown) fwd -= 1;
  if (keys.KeyD) side += 1; if (keys.KeyA) side -= 1;
  if (keys.ArrowLeft) player.yaw += dt * 2.6; if (keys.ArrowRight) player.yaw -= dt * 2.6;
  fwd -= touch.my; side += touch.mx;
  const len = Math.hypot(fwd, side);
  if (len > 1) { fwd /= len; side /= len; }
  const speed = (keys.ShiftLeft || keys.ShiftRight || (isTouch && len > .9)) ? 11 : 7.5;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  const mx = (-sy * fwd + cy * side) * speed * dt, mz = (-cy * fwd - sy * side) * speed * dt;
  tryMove(player, mx, mz, player.r);
  const moving = len > .1;
  if (moving && player.y <= 0) game.bob += dt * speed * 1.4;
  player.vy -= 18 * dt; player.y = Math.max(0, player.y + player.vy * dt); if (player.y === 0) player.vy = 0;

  // Kamera
  game.shake = Math.max(0, game.shake - dt * 2.5);
  const sh = game.shake * .12;
  camera.position.set(player.x + rnd(-sh, sh), EYE + player.y + Math.sin(game.bob * 2) * .06 * (moving ? 1 : .2) + rnd(-sh, sh), player.z + rnd(-sh, sh));
  camera.rotation.set(player.pitch + game.recoil * .02, player.yaw, 0);

  // Waffe
  game.cooldown -= dt;
  if (game.firing && WEAPONS[game.weapon].auto) fire();
  game.recoil = Math.max(0, game.recoil - dt * (game.weapon ? 9 : 4));
  gunRoot.position.set(.3 + Math.cos(game.bob) * .025, -.3 - Math.abs(Math.sin(game.bob)) * .02 - game.recoil * .03, -.55 + game.recoil * .09);
  gunRoot.rotation.x = game.recoil * .25;
  if (game.weapon === 1) spinner.rotation.z += dt * (game.firing && WEAPONS[1].ammo > 0 ? 30 : 2);
  game.flashT -= dt; muzzle.visible = game.flashT > 0; muzzleLight.intensity = game.flashT > 0 ? 3.2 : 0;
  dmgEl.style.opacity = Math.max(0, parseFloat(dmgEl.style.opacity || 0) - dt * 1.6);

  // KI
  flowT -= dt; if (flowT <= 0) { buildFlow(player.x, player.z); flowT = .25; }
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].update(dt) === false) enemies.splice(i, 1);
  updateProjectiles(dt); updatePickups(dt); updateParticles(dt);

  // Wellen
  if (game.queue.length) { game.spawnT -= dt; if (game.spawnT <= 0) { trySpawn(); game.spawnT = Math.max(.35, .9 - game.wave * .05); } }
  else if (!enemies.some(e => !e.dead)) {
    if (game.waveDelay > 0) { game.waveDelay -= dt; if (game.waveDelay <= 0) startWave(); }
    else if (game.wave > 0) {
      game.waveDelay = 3.5; showMsg('WELLE ' + game.wave + ' GESCHAFFT!', 2200);
      player.hp = Math.min(100, player.hp + 20); WEAPONS[0].ammo = Math.min(WEAPONS[0].max, WEAPONS[0].ammo + 8); WEAPONS[1].ammo = Math.min(WEAPONS[1].max, WEAPONS[1].ammo + 50);
      updateHud();
    }
  }
}
let miniT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (game.state === 'play') step(dt);
  else if (game.state === 'menu') { // Attract-Modus: langsame Kamerafahrt
    const t = now / 1000;
    camera.position.set(W * CELL / 2 + Math.cos(t * .15) * 10, EYE + 1, H * CELL / 2 + Math.sin(t * .15) * 10);
    camera.rotation.set(-.05, t * .15 + Math.PI, 0);
  }
  if (game.state !== 'paused') {
    if (game.state !== 'play') { for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead && enemies[i].update(dt) === false) enemies.splice(i, 1); updateParticles(dt); }
  }
  miniT -= dt; if (miniT <= 0) { drawMinimap(); miniT = .1; }
  renderer.render(scene, camera);
}

faceImg.onload = () => {
  makeFaceTextures(faceImg);
  $('ovFace').src = FACE_SRC;
  // ein paar Deko-Grinser für das Startmenü
  for (let i = 0; i < 5; i++) { const c = spawnCells[i % spawnCells.length]; const e = new Enemy(i === 2 ? 'brute' : 'imp', (c.x + .5) * CELL, (c.z + .5) * CELL); e.spawnT = 0; e.g.scale.setScalar(e.s); enemies.push(e); }
  buildFlow(W * CELL / 2, H * CELL / 2);
  ovBtn.disabled = false; ovBtn.textContent = 'START';
  requestAnimationFrame(loop);
};
faceImg.src = FACE_SRC;
</script>
